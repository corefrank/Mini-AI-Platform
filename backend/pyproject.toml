[project]
name = "mini-ai-platform"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anyio>=4.8,<5",
    "numpy>=2,<3",
    "fastapi>=0.115.12,<0.142",
    "uvicorn>=0.34,<0.53",
    "pydantic>=2.11,<3",
    "sqlalchemy>=2.0.40,<2.1",
    "psycopg[binary]>=3.2,<4",
    "redis>=5.2,<7",
    "celery[redis]>=5.5,<5.7",
    "httpx>=0.28,<0.29",
    "PyJWT>=2.10.1,<3",
    "pwdlib[argon2]>=0.2,<1",
    "python-multipart>=0.0.22,<1",
    "faiss-cpu>=1.10,<2",
    "rank-bm25==0.2.2",
    "sentence-transformers>=4.1,<6",
    "torch>=2.6,<3",
]

[dependency-groups]
dev = ["pytest>=8.3,<9"]

[tool.uv]
package = false

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
